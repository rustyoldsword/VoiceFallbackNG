[General]
; 0 = the mod does nothing
bEnabled=1
; 1 = voice-type checks (GetIsVoiceType) accept a unique voice as its fallback voices, so the speaker gets
;     the lines other mods reserve for those voices; 0 = only borrow audio for lines the speaker already gets
bUnlockLines=1
; 1 = every adult voice type that does not come from Skyrim.esm or the official DLC is handled
bAutoDetect=1
; 1 = if no voice of the chain has the file, any vanilla adult voice of the same sex may be used
bLastResort=1
; 1 = one log line per borrowed or missing voice file (VoiceFallbackNG.log)
bLogSubstitutions=0

[Fallback]
; voice types (EditorID) tried in order, for voices that have no rule in VoiceFallbackNG\*.json
sFemaleChain=FemaleNord,FemaleEvenToned,FemaleYoungEager
sMaleChain=MaleNord,MaleEvenToned,MaleYoungEager
